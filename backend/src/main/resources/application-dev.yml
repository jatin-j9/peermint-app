spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/peermint_dev?serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: PeerMintHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: none

    show-sql: false

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

logging:
  level:
    root: INFO
    com.peermint: DEBUG
    org.springframework.security: INFO
