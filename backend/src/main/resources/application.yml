spring:
  application:
    name: peermint-backend

  profiles:
    default: dev

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

info:
  application:
    name: PeerMint
    description: Student Peer Tutoring and Skill Exchange Platform
    version: 0.1.0
